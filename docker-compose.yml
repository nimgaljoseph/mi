services:
  ollama:
    image: ollama/ollama
    volumes: ["./data/ollama:/root/.ollama"]
  mini:
    build: { context: ., dockerfile: backend/Dockerfile }
    environment: { OLLAMA_URL: "http://ollama:11434" }
    volumes: ["./data:/app/data", "./models:/app/models"]
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [ollama]
# After first start: docker compose exec ollama ollama pull qwen2.5:7b  (and nomic-embed-text, moondream)
